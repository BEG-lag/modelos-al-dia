[project]
name = "modelos-al-dia"
version = "0.1.0"
description = "Los modelos de OpenAI, Anthropic, Google y xAI al día: catálogo, precios, capacidades, agentes de código y novedades oficiales, cada dato con su fuente."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamín Esponda García" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://beg-lag.github.io/modelos-al-dia/"
Repository = "https://github.com/BEG-lag/modelos-al-dia"
Author = "https://pivotek.mx"

[project.scripts]
modelos-al-dia = "modelos_al_dia.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelos_al_dia"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/modelos_al_dia/site.py" = ["E501"]
"src/modelos_al_dia/tablas.py" = ["E501"]
