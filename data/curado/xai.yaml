# Ficha curada de xAI / SpaceXSI (Grok). Formato: data/curado/_ejemplo.yaml.
# Precios en USD. Precios de API en USD por millón de tokens (tramo de prompt < 200k tokens;
# a partir de 200k tokens se cobra el doble en todos los modelos de texto vigentes).

clave: xai
proveedor: "SpaceXSI (SpaceX Super Intelligence LLC, antes xAI)"
matriz: "SpaceX (Space Exploration Technologies Corp., Nasdaq: SPCX)"
# SpaceX anunció la adquisición de xAI el 2026-02-02 (https://x.ai/news/xai-joins-spacex).
# El pie de página de x.ai ya dice "SpaceX Super Intelligence LLC" (https://x.ai/news/x-subscription).
verificado: 2026-11-23
sitio_novedades: https://x.ai/news

app:
  nombre: Grok
  url: https://grok.com
  # Desde el 2026-10-12 los planes nuevos son "The X Subscription" (Grok + Grok Bot + Cursor + X Premium).
  planes:
    - nombre: Gratis
      precio_usd_mes: 0
      incluye: "Acceso diario a Grok con límites, cuota inicial de agentes de Cursor, X estándar"
      fuente: https://x.ai/news/x-subscription
      etiqueta: null
    - nombre: Plus
      precio_usd_mes: 8
      incluye: "Más uso de Grok (chat, voz, imagen) y Cursor; palomita de X, herramientas de creador, menos anuncios. Sin video ni Grok Bot según terceros"
      fuente: https://x.ai/news/x-subscription
      etiqueta: null
    - nombre: Premium
      precio_usd_mes: 30
      incluye: "4x el uso de Plus; beneficios de SuperGrok, Cursor Pro y X Premium+; video, Grok Bot y modelos Grok más recientes"
      fuente: https://x.ai/news/x-subscription
      etiqueta: null
    - nombre: Super
      precio_usd_mes: 100
      incluye: "15x el uso de Plus; todo lo de Premium y prioridad en horas pico"
      fuente: https://x.ai/news/x-subscription
      etiqueta: null
    - nombre: Ultra
      precio_usd_mes: 200
      incluye: "50x el uso de Plus; todo lo anterior y acceso anticipado a productos y modelos"
      fuente: https://x.ai/news/x-subscription
      etiqueta: null
    - nombre: Equipos (Premium, Super o Ultra por asiento)
      precio_usd_mes: 30
      incluye: "Mismos precios por asiento que los planes individuales (30, 100 o 200 USD); Plus no se ofrece a equipos"
      fuente: https://x.ai/news/x-subscription
      etiqueta: null
    - nombre: SuperGrok Lite (legado)
      precio_usd_mes: 10
      incluye: "Plan anterior, sólo para suscriptores existentes (lanzado en marzo de 2026)"
      fuente: https://www.businesstoday.in/technology/story/xai-makes-grok-affordable-with-new-supergrok-lite-plan-check-price-and-what-it-offers-522462-2026-03-26
      etiqueta: SUPUESTO
    - nombre: SuperGrok (legado)
      precio_usd_mes: 30
      incluye: "Plan anterior; quien lo tenga lo conserva o migra a The X Subscription con reembolso prorrateado"
      fuente: https://x.ai/news/x-subscription
      etiqueta: SUPUESTO
    - nombre: SuperGrok Plus (legado)
      precio_usd_mes: 100
      incluye: "Plan anterior, sólo para suscriptores existentes (precio según ficha de App Store citada por terceros)"
      fuente: https://www.roborhythms.com/?p=35730
      etiqueta: SUPUESTO
    - nombre: SuperGrok Heavy (legado)
      precio_usd_mes: 300
      incluye: "Plan anterior de máxima capacidad (modelos Heavy/multiagente, acceso anticipado a Grok Build y Grok Bot)"
      fuente: https://www.roborhythms.com/?p=35730
      etiqueta: SUPUESTO
    - nombre: X Premium / Premium+ (legado)
      precio_usd_mes: null
      incluye: "Los suscriptores existentes conservan su plan; Premium+ quedó integrado como beneficio del plan Premium de 30 USD. Precio vigente de los planes sueltos no confirmado"
      fuente: https://x.ai/news/x-subscription
      etiqueta: BRECHA

capacidades:
  razonamiento:          {estado: si, detalle: "Todos los modelos 4.x razonan con esfuerzo configurable (none/low a xhigh); en la app, modos Think/Auto y multiagente (Grok 4.20)", fuente: https://docs.x.ai/docs/models/grok-4.7}
  busqueda_web:          {estado: si, detalle: "Búsqueda web y búsqueda en X (posts, usuarios, hilos) en la app y como herramientas del servidor en la API", fuente: https://docs.x.ai/docs/guides/tools/overview}
  investigacion_profunda: {estado: si, detalle: "DeepSearch en la app (desde 2025) y Grok 4.20 multiagente para investigación; nombre y alcance actuales en la app [SUPUESTO]", fuente: https://x.ai/news/grok-3}
  generacion_imagen:     {estado: si, detalle: "Grok Imagine Image 2.0 (modo Calidad en grok.com/imagine y apps; API grok-imagine-image-2.0)", fuente: https://x.ai/news/grok-imagine-image-2}
  generacion_video:      {estado: si, detalle: "Grok Imagine Video 1.5 con audio, referencias de imagen y voz, hasta 1080p; en la app la variante Fast. Video requiere plan Premium o superior", fuente: https://x.ai/news/grok-imagine-video-1-5}
  voz_tiempo_real:       {estado: si, detalle: "Modo de voz en la app; API Voice Agent con grok-voice-3.0 (voz a voz), STT y TTS, voces personalizadas", fuente: https://x.ai/news/grok-voice-3}
  vision_archivos:       {estado: si, detalle: "Entrada de imagen en todos los modelos de texto; Files API y Collections Search para documentos", fuente: https://docs.x.ai/docs/models}
  memoria:               {estado: si, detalle: "Memoria de conversaciones en la app (desde abril de 2025, desactivable); Grok Bot recuerda conversaciones y flujos. Estado 2026 en la app no reverificado", fuente: https://techcrunch.com/2025/04/16/xai-adds-a-memory-feature-to-grok}
  agente_navegador:      {estado: si, detalle: "Grok Bot (beta desde 2026-08-11): agentes 24/7 que operan sitios web, correo y apps desde su propia computadora en la nube", fuente: https://x.ai/news/introducing-grok-bot}
  uso_computadora:       {estado: si, detalle: "Grok Bot opera una computadora propia en la nube (macOS e iOS para el cliente); sin herramienta de uso de computadora en la API", fuente: https://x.ai/news/introducing-grok-bot}
  agente_codigo:         {estado: si, detalle: "Grok Build (CLI con subagentes, modo headless, ACP) y Cursor, incluido en The X Subscription (SpaceX acordó comprar Cursor en junio de 2026)", fuente: https://x.ai/news/grok-build-cli}
  ejecucion_codigo:      {estado: si, detalle: "Herramienta Code Execution (Python en sandbox) en la API; en la app vía agentes", fuente: https://docs.x.ai/docs/guides/tools/overview}
  conectores_mcp:        {estado: si, detalle: "Conectores y MCP propio en grok.com desde 2026-05-06; Remote MCP en la API desde noviembre de 2025", fuente: https://docs.x.ai/grok/connectors}
  modelos_abiertos:      {estado: parcial, detalle: "Pesos de Grok 1 y Grok 2.5 en Hugging Face (licencia restrictiva en Grok 2.5); Grok 3 prometido, no publicado", fuente: https://huggingface.co/xai-org}

