# Ficha curada de OpenAI. Formato: data/curado/_ejemplo.yaml
# Precios en USD. Precios de API en USD por millón de tokens, nivel Standard y contexto corto (<=272K de entrada).

clave: openai
proveedor: OpenAI Group PBC
matriz: OpenAI Foundation
verificado: 2026-11-23
sitio_novedades: https://openai.com/news/

app:
  nombre: ChatGPT
  url: https://chatgpt.com
  planes:
    - nombre: Free
      precio_usd_mes: 0
      incluye: "GPT-6 Luna en Chat; imagen, voz, deep research, memoria y Codex limitados; Work sólo en la app de escritorio y limitado; puede incluir anuncios"
      fuente: https://chatgpt.com/pricing
    - nombre: Go
      precio_usd_mes: 8
      incluye: "Más mensajes, cargas, imágenes y voz que Free; memoria más larga; tareas programadas; GPT-6 Luna; Codex y deep research limitados; puede incluir anuncios"
      fuente: https://learn.chatgpt.com/docs/pricing
    - nombre: Plus
      precio_usd_mes: 20
      incluye: "Modelos de razonamiento (GPT-6.2 en Chat; GPT-6.2 Astra y Sol en Work y Codex), deep research y memoria ampliados, proyectos, GPTs, Sites, Space, Codex ampliado, ChatGPT Work en escritorio, web y móvil"
      fuente: https://help.openai.com/en/articles/6950777-what-is-chatgpt-plus
    - nombre: Pro 100
      precio_usd_mes: 100
      incluye: "Todo Plus; GPT-6 Pro; dots (agentes siempre activos); sesiones más largas de Work y Codex; imagen ilimitada; voz ilimitada; sin Ultrafast"
      fuente: https://help.openai.com/en/articles/9793128-about-chatgpt-pro-tiers
    - nombre: Pro 200
      precio_usd_mes: 200
      incluye: "Todo Pro 100 con más uso de Work y Codex; Ultrafast sólo con GPT-6.2 Sol en Codex"
      fuente: https://help.openai.com/en/articles/9793128-about-chatgpt-pro-tiers
    - nombre: Pro 500
      precio_usd_mes: 500
      incluye: "Mayor uso incluido de los planes Pro; Ultrafast con GPT-6 Astra, GPT-6.1 Sol y modelos GPT-6.2 en Work y Codex"
      fuente: https://help.openai.com/en/articles/9793128-about-chatgpt-pro-tiers
    - nombre: Business Standard
      precio_usd_mes: 25
      incluye: "Por usuario, pago mensual (20 USD por usuario al mes con pago anual). ChatGPT, Work y Codex, Company Knowledge, agente, deep research, controles de administración, sin entrenamiento con datos de la empresa"
      fuente: https://openai.com/business/pricing
    - nombre: Business Premium
      precio_usd_mes: 125
      incluye: "Por usuario, pago mensual (100 USD por usuario al mes con pago anual). Lo mismo que Standard con 5 veces más uso, sin límite de 5 horas y acceso a dots"
      fuente: https://openai.com/business/pricing
    - nombre: Enterprise
      precio_usd_mes: null
      incluye: "Precio no publicado (contactar a ventas, facturación anual). Todo Business más SCIM, EKM, RBAC, residencia de datos y procesamiento prioritario"
      fuente: https://learn.chatgpt.com/docs/pricing

# Valores de `estado`: si | parcial | no | brecha
capacidades:
  razonamiento:          {estado: si, detalle: "Niveles de pensamiento en el selector (Instant a Extra High) y GPT-6 Pro con agentes en paralelo; en API, reasoning effort y modo pro", fuente: https://help.openai.com/en/articles/6825453-chatgpt-release-notes}
  busqueda_web:          {estado: si, detalle: "Búsqueda en ChatGPT y herramienta web_search en la Responses API", fuente: https://developers.openai.com/api/docs/guides/tools}
  investigacion_profunda: {estado: si, detalle: "Deep research en todos los planes (limitado en Free y Go, máximo en Pro)", fuente: https://chatgpt.com/pricing}
  generacion_imagen:     {estado: si, detalle: "ChatGPT Images 2.6 (GIF animados, imágenes de referencia); API gpt-image-2.6-sunburst y -flare", fuente: https://help.openai.com/en/articles/6825453-chatgpt-release-notes}
  generacion_video:      {estado: no, detalle: "Sora descontinuado: app y sora.com cerraron el 2026-04-26 y la API de video el 2026-09-24, sin reemplazo", fuente: https://help.openai.com/articles/20001152-what-to-know-about-the-sora-discontinuation}
  voz_tiempo_real:       {estado: si, detalle: "GPT-Live (dúplex completo) en ChatGPT; Advanced y Standard Voice se retiran el 2026-12-11; API gpt-realtime-2.1 y gpt-live-1.1", fuente: https://help.openai.com/en/articles/6825453-chatgpt-release-notes}
  vision_archivos:       {estado: si, detalle: "Imágenes, PDF, hojas de cálculo, audio (transcripción y resumen) y escaneo de documentos; modelos de API aceptan texto e imagen", fuente: https://help.openai.com/en/articles/6825453-chatgpt-release-notes}
  memoria:               {estado: si, detalle: "Memoria que se actualiza sola, referencias a chats anteriores, memoria por proyecto", fuente: https://help.openai.com/en/articles/6825453-chatgpt-release-notes}
  agente_navegador:      {estado: si, detalle: "ChatGPT Work con navegador integrado y extensión de Chrome; dots con computadora y navegador en la nube. El navegador Atlas se retiró en 2026", fuente: https://openai.com/index/chatgpt-for-your-most-ambitious-work}
  uso_computadora:       {estado: si, detalle: "Computer Use en la app de escritorio (Work y Codex, macOS y Windows); herramienta computer use en la Responses API", fuente: https://openai.com/index/chatgpt-for-your-most-ambitious-work}
  agente_codigo:         {estado: si, detalle: "Codex (CLI, IDE, app de escritorio, web, móvil, Codex Cloud, code review)", fuente: https://learn.chatgpt.com/docs/pricing}
  ejecucion_codigo:      {estado: si, detalle: "Análisis de datos en ChatGPT; herramienta Shell en contenedores alojados en la API", fuente: https://developers.openai.com/api/docs/guides/tools}
  conectores_mcp:        {estado: si, detalle: "Plugins (antes apps y conectores) y modo desarrollador con servidores MCP remotos; Remote MCP en la Responses API", fuente: https://developers.openai.com/api/docs/guides/developer-mode}
  modelos_abiertos:      {estado: si, detalle: "gpt-oss-120b y gpt-oss-20b (Apache 2.0, agosto de 2025); sin sucesor anunciado", fuente: https://openai.com/index/introducing-gpt-oss/}

