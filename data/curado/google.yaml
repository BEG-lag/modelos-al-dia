# Ficha curada de Google (Gemini). Formato: data/curado/_ejemplo.yaml.
# Precios en USD. Precios de API en USD por millón de tokens, nivel Standard de pago.
# Nota: la documentación de la API Gemini se mudó de ai.google.dev/gemini-api/docs a
# aistudio.google.com/docs (redirección 301); las fuentes usan la URL nueva.

clave: google
proveedor: Google (Google DeepMind)
matriz: Alphabet
verificado: 2026-11-23
sitio_novedades: https://blog.google/innovation-and-ai/models-and-research/gemini-models/

app:
  nombre: Gemini
  url: https://gemini.google.com
  planes:
    - nombre: Gratis
      precio_usd_mes: 0
      incluye: "Gemini 4 Hydrogen con selección automática de modelo, Deep Research, Gemini Live, Canvas, generación de imagen, Gemini Notebook, límites básicos semanales en Google Antigravity, 15 GB"
      fuente: https://gemini.google/us/subscriptions/?hl=en
    - nombre: Google AI Plus
      precio_usd_mes: 4.99
      incluye: "Gemini 4 Hydrogen con 2x el uso de Gratis, generación de video (Gemini Omni), Google Flow (200 créditos), Gemini en Chrome con auto browse, Gemini en apps de Google, 400 GB. Bajó de 7.99 a 4.99 en junio de 2026"
      fuente: https://gemini.google/us/subscriptions/?hl=en
    - nombre: Google AI Pro
      precio_usd_mes: 19.99
      incluye: "Gemini 4 Neon y Hydrogen, Gemini 3.1 Pro, Deep Research, contexto de 1M, 4x el uso de Gratis, Flow (1,000 créditos), auto browse ampliado en Chrome, Antigravity con límites de entrada, Tasks en Gemini, 5 TB"
      fuente: https://gemini.google/us/subscriptions/?hl=en
    - nombre: Google AI Ultra (5x)
      precio_usd_mes: 99.99
      incluye: "Máximo acceso a Gemini 4 Carbon, Neon y Hydrogen; 5x los límites de AI Pro en la app y Antigravity; Veo 3.1; acceso anticipado a Agent Mode; Gemini Spark (beta, sólo EE.UU.); Flow (10,000 créditos); YouTube Premium; 20 TB. Nivel creado en I/O 2026 (19 may 2026)"
      fuente: https://gemini.google/us/subscriptions/?hl=en
    - nombre: Google AI Ultra (20x)
      precio_usd_mes: 199.99
      incluye: "Todo lo de Ultra 5x con 20x los límites de AI Pro, Project Genie, Flow (25,000 créditos), 30 TB. Bajó de 249.99 a 199.99 en I/O 2026"
      fuente: https://blog.google/products-and-platforms/products/google-one/google-ai-subscriptions/

# Valores de `estado`: si | parcial | no | brecha
capacidades:
  razonamiento:          {estado: si, detalle: "Niveles de pensamiento en Gemini 4 (low, medium, high; Neon y Hydrogen agregan xhigh). Deep Think: último anuncio oficial es la actualización de Gemini 3 Deep Think (12 feb 2026, sólo Ultra); la página de planes vigente ya no lo menciona [BRECHA DE DATO]", fuente: "https://gemini.google/release-notes/"}
  busqueda_web:          {estado: si, detalle: "Búsqueda de Google integrada en la app; en la API, grounding con Google Search y Google Maps", fuente: "https://aistudio.google.com/docs/models/gemini-4-carbon"}
  investigacion_profunda: {estado: si, detalle: "Deep Research en la app desde el plan Gratis; en la API, agentes deep-research-preview-04-2026 y deep-research-max-preview-04-2026 (Interactions API)", fuente: "https://aistudio.google.com/docs/changelog"}
  generacion_imagen:     {estado: si, detalle: "Nano Banana (2.1, 2, Pro y 2 Lite) en app, Flow, Google Pics y API", fuente: "https://aistudio.google.com/docs/models"}
  generacion_video:      {estado: si, detalle: "Gemini Omni Flash en app y Flow desde AI Plus; Veo 3.1 en Ultra. En la API: gemini-omni-1.2-flash y genie-4; Veo 3.1 preview se retiró de la API Gemini el 22 oct 2026 (sigue en Gemini Enterprise Agent Platform)", fuente: "https://aistudio.google.com/docs/video"}
  voz_tiempo_real:       {estado: si, detalle: "Gemini Live (voz y cámara, integrado en el chat desde I/O 2026); API Live con gemini-3.8-live", fuente: "https://gemini.google/release-notes/"}
  vision_archivos:       {estado: si, detalle: "Texto, imagen, video, audio, PDF y, desde nov 2026, archivos de Office y OpenDocument (DOC, PPT, ODP, ODS)", fuente: "https://aistudio.google.com/docs/changelog"}
  memoria:               {estado: si, detalle: "Memories (antes past chats), importación de memorias de otras apps (mar 2026), menú Personalize y Personal Intelligence con Gmail y Photos", fuente: "https://gemini.google/release-notes/"}
  agente_navegador:      {estado: si, detalle: "Gemini en Chrome con auto browse (AI Plus, Pro y Ultra; empezó en EE.UU. en ene 2026); Agent Mode en acceso anticipado para Ultra. Project Mariner cerrado en mayo 2026 según reportes [SUPUESTO]", fuente: "https://gemini.google/us/subscriptions/?hl=en"}
  uso_computadora:       {estado: si, detalle: "Computer Use GA en la API (30 oct 2026) en Gemini 4 y 3.x Flash; en consumo, Gemini Spark en macOS (Ultra) y Tasks en Gemini", fuente: "https://aistudio.google.com/docs/changelog"}
  agente_codigo:         {estado: si, detalle: "Google Antigravity 2.0 (escritorio, CLI, SDK y dentro de la app de Gemini para macOS). Gemini CLI migró a Antigravity CLI (acceso de consumo terminó 18 jun 2026). Jules cierra el 31 dic 2026 (sólo lectura desde 11 nov 2026)", fuente: "https://developers.googleblog.com/an-important-update-transitioning-gemini-cli-to-antigravity-cli/"}
  ejecucion_codigo:      {estado: si, detalle: "Herramienta de ejecución de código en la API; Canvas en la app", fuente: "https://aistudio.google.com/docs/models/gemini-4-carbon"}
  conectores_mcp:        {estado: parcial, detalle: "App: más de 40 apps conectadas y Connected Apps Platform basada en MCP en vista previa por solicitud; apps personalizadas por URL de servidor MCP remoto según reportes [SUPUESTO]. MCP pleno en Antigravity y Gemini Enterprise", fuente: "https://developers.google.com/connected-apps/mcp"}
  modelos_abiertos:      {estado: si, detalle: "Gemma 4 (E2B, E4B, 12B Unified, 26B A4B MoE, 31B) con licencia Apache 2.0", fuente: "https://gemma.ai/models/gemma-4/model-card/"}

