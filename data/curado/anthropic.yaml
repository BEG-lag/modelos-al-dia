# Ficha curada de Anthropic (data/curado/anthropic.yaml).
# Verificada el 2026-11-23 contra fuentes oficiales: platform.claude.com (models overview, pricing,
# model deprecations), anthropic.com/news, claude.com/pricing y support.claude.com (notas de versión).
# Fechas de lanzamiento de modelos 2026: notas de versión de support.claude.com y anuncios oficiales.
# Precios en USD. Precios de API en USD por millón de tokens.

clave: anthropic
proveedor: Anthropic PBC
matriz: null
verificado: 2026-11-23
sitio_novedades: https://www.anthropic.com/news

app:
  nombre: Claude
  url: https://claude.ai
  planes:
    - nombre: Gratis
      precio_usd_mes: 0
      incluye: "Uso limitado cada 5 horas y por semana; Sonnet y Haiku, búsqueda web, creación de archivos, ejecución de código, memoria, conectores, Artifacts, Claude Design/Slides/Docs y hasta 5 Proyectos. Sin Opus, Research ni Claude Code"
      fuente: https://claude.com/pricing
    - nombre: Pro
      precio_usd_mes: 20
      incluye: "17 USD/mes con pago anual (200 USD por adelantado). Más uso que Gratis, Opus y más modelos, Research, memoria, Claude Code, Claude in Chrome, Microsoft 365, tareas programadas; Fable con créditos de uso o cupo parcial (ver pendientes)"
      fuente: https://claude.com/pricing
    - nombre: Max
      precio_usd_mes: 100
      incluye: "Antes Max 5x. Todo lo de Pro, 5x el uso de Pro, Fable hasta la mitad del límite semanal, 100 USD/mes en créditos de API, acceso anticipado y prioridad en horas pico"
      fuente: https://claude.com/pricing
    - nombre: Ultra
      precio_usd_mes: 200
      incluye: "Antes Max 20x. Todo lo de Max, sin límite de 5 horas para cuentas verificadas, 10x el uso semanal de Pro y 200 USD/mes en créditos de API"
      fuente: https://claude.com/pricing
    - nombre: Team (asiento Standard)
      precio_usd_mes: 25
      incluye: "Por asiento; 20 USD con pago anual. 2 a 150 usuarios. Todas las funciones con más uso que Pro: Claude Code, Cowork, Design/Slides/Docs, Microsoft 365, Claude Tag (Slack); hasta 500 USD/mes de créditos de API compartidos"
      fuente: https://claude.com/pricing
    - nombre: Team (asiento Premium)
      precio_usd_mes: 125
      incluye: "Por asiento; 100 USD con pago anual. 5x el uso del asiento Standard y Fable hasta 50% del límite semanal; se pueden mezclar tipos de asiento"
      fuente: https://claude.com/pricing
    - nombre: Enterprise
      precio_usd_mes: 20
      incluye: "20 USD por asiento al mes con pago anual (mínimo 20 asientos) más el uso a tarifas de API. Todo lo de Team, SCIM, bitácoras de auditoría, Compliance API, retención personalizada, opción HIPAA, Claude Security (beta). Versión autoservicio y versión con ventas"
      fuente: https://claude.com/pricing
    - nombre: Education
      precio_usd_mes: null
      incluye: "Plan institucional para alumnos, docentes y personal; precio solo por contacto con ventas"
      fuente: https://claude.com/pricing
      etiqueta: BRECHA

# Valores de `estado`: si | parcial | no | brecha
capacidades:
  razonamiento:          {estado: si, detalle: "Pensamiento adaptativo con selector de esfuerzo (Low a Max); siempre activo en Fable 5.2 y Opus 5.5", fuente: https://support.claude.com/en/articles/8664678-what-claude-models-can-i-access}
  busqueda_web:          {estado: si, detalle: "En todos los planes, incluido Gratis", fuente: https://claude.com/pricing}
  investigacion_profunda: {estado: si, detalle: "Research en planes de pago (Pro, Max, Ultra, Team, Enterprise), web, escritorio y móvil; usa búsqueda web y conectores", fuente: https://support.claude.com/en/articles/11088861-using-research-on-claude}
  generacion_imagen:     {estado: no, detalle: "No genera fotos ni ilustraciones; sí hace visuales interactivos en HTML/SVG, diagramas, gráficas y diseños con Claude Design", fuente: https://support.claude.com/en/articles/9002504-can-claude-produce-images}
  generacion_video:      {estado: no, detalle: "Sin generación de video en planes, anuncios ni notas de versión", fuente: https://claude.com/pricing, etiqueta: SUPUESTO}
  voz_tiempo_real:       {estado: si, detalle: "Modo de voz (beta) en todos los planes, en web, escritorio y móvil; corre con Opus, Sonnet y Haiku desde julio de 2026 (no con Fable); usa conectores; 14 idiomas", fuente: https://support.claude.com/en/articles/11101966-use-voice-mode}
  vision_archivos:       {estado: si, detalle: "Imágenes, PDF, hojas de cálculo y documentos; todos los modelos vigentes aceptan imagen y PDF", fuente: https://platform.claude.com/docs/en/build-with-claude/pdf-support}
  memoria:               {estado: si, detalle: "Memoria de historial (Gratis desde 2026-03-02), entradas categorizadas y editables, compartida entre chat y Cowork en la nube", fuente: https://support.claude.com/en/articles/12138966-release-notes}
  agente_navegador:      {estado: si, detalle: "Claude in Chrome, disponible en general desde 2026-08-26 para planes de pago; solo Google Chrome de escritorio", fuente: https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome}
  uso_computadora:       {estado: si, detalle: "Computer use en Cowork (vista previa Pro y Max desde 2026-03-23; beta Team y Enterprise desde 2026-11-20) y herramientas computer/browser use en la API", fuente: https://support.claude.com/en/articles/12138966-release-notes}
  agente_codigo:         {estado: si, detalle: "Claude Code (terminal, IDE, escritorio y web), incluido desde Pro y en asientos Team Standard", fuente: https://claude.com/pricing}
  ejecucion_codigo:      {estado: si, detalle: "Ejecución de código y creación de archivos en todos los planes; Artifacts en todos los planes", fuente: https://claude.com/pricing}
  conectores_mcp:        {estado: si, detalle: "Conectores MCP, directorio de plugins y Agent Skills (estándar abierto donado a la Agentic AI Foundation en octubre de 2026)", fuente: https://www.anthropic.com/news/donating-agent-skills-to-the-agentic-ai-foundation}
  modelos_abiertos:      {estado: no, detalle: "No publica pesos abiertos; postura publicada en julio de 2026", fuente: https://www.anthropic.com/news/position-open-weights-models}

