# Ficha comparativa de agentes de programación con IA (data/curado/agentes-codigo.yaml).
# Reglas:
# - Cada producto lleva `fuente` (URL oficial de preferencia) y la ficha lleva `verificado`.
# - Lo no confirmado se marca con `etiqueta` (ESTIMADO | SUPUESTO | BRECHA) o con `estado: brecha`.
# - Precios en USD por mes. `plan_minimo_usd_mes` es el plan más barato que da acceso al agente
#   (0 = hay nivel gratuito con límites; null = no hay plan individual público).
# - Español mexicano, sin guion largo.
verificado: 2026-11-23
# Valores de estado: si | parcial | no | brecha
productos:
  - clave: claude-code
    nombre: Claude Code
    empresa: Anthropic
    tipo: agente de terminal, IDE, escritorio y nube
    lanzamiento: 2025-02-24
    superficies: [cli, ide, escritorio, web, movil, nube, slack]
    modelos: ["Claude Opus 5.5", "Claude Sonnet 5.5", "Claude Haiku 5.5", "Claude Fable 5.2"]
    multi_proveedor: no
    codigo_abierto: no
    precio: "Incluido en Pro (20 USD/mes mensual o 17 USD/mes anual), Max (desde 100 USD/mes), Team y Enterprise; o pago por uso con API. Fable 5.2 puede cobrarse aparte con créditos de uso."
    plan_minimo_usd_mes: 20
    capacidades:
      mcp:               {estado: si, detalle: "Servidores MCP locales y remotos; claude mcp add-json"}
      subagentes:        {estado: si, detalle: "Subagentes, equipos de agentes y workflows dinámicos; agentes en segundo plano"}
      ejecucion_en_nube: {estado: si, detalle: "Sesiones en la nube (claude.ai/code, claude --cloud) y tareas programadas en la nube"}
      pr_automaticos:    {estado: si, detalle: "Crea ramas, commits y PR; @Claude en Slack devuelve un PR; GitHub Actions y GitLab CI/CD"}
      revision_codigo:   {estado: si, detalle: "GitHub Code Review automático en cada PR y comando /code-review"}
      navegador:         {estado: si, detalle: "Integración con Chrome para depurar apps web; uso de computadora en macOS"}
      hooks_extensiones: {estado: si, detalle: "Hooks, skills, plugins y marketplaces de plugins"}
      memoria_proyecto:  {estado: si, detalle: "CLAUDE.md (lee AGENTS.md) y auto memory entre sesiones"}
      sdk:               {estado: si, detalle: "Claude Agent SDK"}
    fuerte_en: "El conjunto más completo de superficies y extensibilidad (hooks, skills, plugins, subagentes) sobre los modelos Claude."
    fuente: https://code.claude.com/docs/en/overview
