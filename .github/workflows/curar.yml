name: Curaduría semanal

# Cada lunes, Claude revisa las fichas de data/curado contra las fuentes oficiales y las
# novedades de la semana, y propone los cambios en un pull request. Nada se publica sin que
# una persona lo apruebe. Necesita el secreto ANTHROPIC_API_KEY; sin él, el job se salta.
on:
  schedule:
    - cron: "0 14 * * 1" # lunes 08:00 en CDMX
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: curar
  cancel-in-progress: false

jobs:
  curar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ¿Hay llave de API?
        id: llave
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "Falta el secreto ANTHROPIC_API_KEY; no se corre la curaduría."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.llave.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v7
        if: steps.llave.outputs.ok == 'true'
        with:
          enable-cache: true

      - name: Revisar fichas con Claude
        if: steps.llave.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Lee y sigue al pie de la letra las instrucciones de .github/prompts/curar.md.
            La fecha de hoy es la que da el comando `TZ=America/Mexico_City date +%F`.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(uv run --frozen modelos-al-dia check),Bash(uv run --frozen modelos-al-dia build),Bash(TZ=America/Mexico_City date +%F),Bash(git diff:*),Bash(git status)"

      - name: Validar
        if: steps.llave.outputs.ok == 'true'
        run: |
          uv run --frozen modelos-al-dia check
          uv run --frozen modelos-al-dia build

      - name: Abrir pull request
        if: steps.llave.outputs.ok == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: curaduria/semanal
          delete-branch: true
          commit-message: "datos(curado): revisión semanal de fichas"
          title: "Curaduría semanal de fichas"
          body-path: .github/prompts/ultimo-resumen.md
          add-paths: |
            data/curado/*.yaml
            docs/**
            TABLAS.md
          labels: curaduria
